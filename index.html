<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interstellar Lens has moved</title>
<meta http-equiv="refresh" content="0; url=https://leafactivity.com/interstellar/">
<link rel="canonical" href="https://leafactivity.com/interstellar/">
<meta name="robots" content="noindex">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070f;color:#e6edff;font-family:system-ui,sans-serif;text-align:center;padding:20px}a{color:#9fb4ff}</style>
<script>
(function(){var to='https://leafactivity.com/interstellar/'+location.search+location.hash;
 function go(){location.replace(to);}
 try{var jobs=[];
  if('serviceWorker' in navigator)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}));
  if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}));
  Promise.all(jobs).then(go,go);setTimeout(go,1500);
 }catch(e){go();}})();
</script></head>
<body><p>Interstellar Lens has moved to<br><a href="https://leafactivity.com/interstellar/">leafactivity.com/interstellar</a></p></body></html>
